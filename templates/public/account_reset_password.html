{% extends "public/base.html" %}
{% block title %}Nouveau mot de passe - {{ site_name }}{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Nouveau mot de passe</h1>
    <p>Choisissez un nouveau mot de passe pour votre compte</p>
</div>

<div class="account-form-wrapper">
    <form method="POST" class="account-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="password">Nouveau mot de passe <span class="required">*</span></label>
            <input type="password" id="password" name="password" class="form-control" required minlength="8">
            <small style="color:var(--text-light);">8 caractères minimum, avec au moins une majuscule et un chiffre.</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirmer le mot de passe <span class="required">*</span></label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="8">
        </div>

        <button type="submit" class="btn btn-gold btn-full">Réinitialiser mon mot de passe</button>
    </form>
</div>

<style>
.account-form-wrapper {
    max-width: 480px;
    margin: 0 auto;
    background: var(--white);
    padding: 40px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}
</style>

{% endblock %}
