{% extends "public/base.html" %}
{% block title %}Connexion - {{ site_name }}{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Connexion</h1>
    <p>Accédez à votre espace client</p>
</div>

<div class="account-form-wrapper">
    <form method="POST" class="account-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if request.args.get('next') %}
        <input type="hidden" name="next" value="{{ request.args.get('next') }}">
        {% endif %}

        <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Mot de passe <span class="required">*</span></label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-gold btn-full">Se connecter</button>

        <p style="text-align:center;margin-top:20px;color:var(--text-light);">
            Pas encore de compte ? <a href="{{ url_for('account_register', next=request.args.get('next')) }}" style="color:var(--gold);">Créer un compte</a>
        </p>
    </form>
</div>

<style>
.account-form-wrapper {
    max-width: 480px;
    margin: 0 auto;
    background: var(--white);
    padding: 40px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}
</style>

{% endblock %}
