{% extends "public/base.html" %}
{% block title %}Panier - {{ site_name }}{% endblock %}
{% block content %}

<div class="page-header">
    <h1><i class="fas fa-shopping-cart" style="color:var(--gold);margin-right:12px;"></i> Votre Panier</h1>
</div>

<!-- PANIER VIDE -->
<div id="cartEmpty" style="text-align:center;padding:60px 0;display:none;">
    <div style="font-size:64px;opacity:0.3;margin-bottom:24px;">
        <i class="fas fa-shopping-bag"></i>
    </div>
    <p style="color:var(--text-light);margin-bottom:24px;font-size:18px;">Votre panier est vide.</p>
    <a href="{{ url_for('produits') }}" class="btn btn-gold">
        <i class="fas fa-arrow-right"></i> Découvrir nos produits
    </a>
</div>

<!-- PANIER CONTENU -->
<div id="cartContent" style="display:none;">
    <div id="cartItems" style="display:flex;flex-direction:column;gap:16px;margin-bottom:32px;"></div>

    <div style="display:flex;justify-content:flex-end;">
        <div style="min-width:280px;background:var(--white);padding:28px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);">
            <div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:20px;font-weight:600;">
                <span><i class="fas fa-receipt" style="color:var(--gold);margin-right:8px;"></i> Total</span>
                <span id="cartTotal">0 €</span>
            </div>
            <a href="{{ url_for('checkout') }}" class="btn btn-gold btn-full">
                <i class="fas fa-arrow-right"></i> Passer la commande
            </a>
        </div>
    </div>
</div>

<script>
function renderCart() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const container = document.getElementById('cartItems');
    const empty = document.getElementById('cartEmpty');
    const content = document.getElementById('cartContent');

    if (cart.length === 0) {
        empty.style.display = 'block';
        content.style.display = 'none';
        return;
    }

    empty.style.display = 'none';
    content.style.display = 'block';
    container.innerHTML = '';
    let total = 0;

    cart.forEach((item, index) => {
        total += item.price * item.quantity;
        
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:16px;background:var(--white);padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);';
        
        row.innerHTML = `
            <img src="${item.image || ''}" alt="${item.name}" style="width:80px;height:80px;object-fit:cover;border-radius:var(--radius);background:var(--bg-2);">
            <div style="flex:1;">
                <div style="font-weight:600;font-size:18px;font-family:'Cormorant Garamond',serif;">${item.name}</div>
                <div style="color:var(--gold-dark);font-weight:600;font-size:18px;">${item.price} €</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <button onclick="updateQty(${index}, -1)" class="qty-btn" style="width:32px;height:32px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:var(--transition);">
                    <i class="fas fa-minus"></i>
                </button>
                <span style="width:40px;text-align:center;font-weight:600;font-size:16px;">${item.quantity}</span>
                <button onclick="updateQty(${index}, 1)" class="qty-btn" style="width:32px;height:32px;background:var(--gold);color:var(--white);border:1px solid var(--gold);border-radius:var(--radius);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:var(--transition);">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <button onclick="removeItem(${index})" style="background:none;border:none;color:#c0392b;cursor:pointer;font-size:18px;padding:8px;transition:var(--transition);">
                <i class="fas fa-trash-can"></i>
            </button>
        `;
        container.appendChild(row);
    });

    document.getElementById('cartTotal').textContent = total.toFixed(2) + ' €';
}

function updateQty(index, delta) {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const newQty = cart[index].quantity + delta;
    if (newQty < 1) return;
    cart[index].quantity = newQty;
    localStorage.setItem('cart', JSON.stringify(cart));
    
    // Mettre à jour le badge du panier flottant
    if (window.updateFloatingCartBadge) window.updateFloatingCartBadge();
    if (window.updateCartDisplay) window.updateCartDisplay();
    
    renderCart();
}

function removeItem(index) {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const removed = cart[index];
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    
    // Mettre à jour le badge du panier flottant
    if (window.updateFloatingCartBadge) window.updateFloatingCartBadge();
    if (window.updateCartDisplay) window.updateCartDisplay();
    
    // Toast notification
    if (window.showToast) {
        window.showToast(removed.name + ' retiré du panier', 'info');
    }
    
    renderCart();
}

// Initialisation
renderCart();
</script>

<style>
.qty-btn:hover {
    transform: scale(1.05);
}
.qty-btn:active {
    transform: scale(0.95);
}
</style>

{% endblock %}
