{% extends "public/base.html" %}
{% block title %}Panier - {{ site_name }}{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Votre Panier</h1>
</div>

<div id="cartEmpty" style="text-align:center;padding:60px 0;display:none;">
    <p style="color:var(--gray);margin-bottom:24px;">Votre panier est vide.</p>
    <a href="{{ url_for('produits') }}" class="btn btn-gold">Découvrir nos produits</a>
</div>

<div id="cartContent">
    <div id="cartItems" style="display:flex;flex-direction:column;gap:16px;margin-bottom:32px;"></div>

    <div style="display:flex;justify-content:flex-end;">
        <div style="min-width:280px;background:var(--white);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow);">
            <div style="display:flex;justify-content:space-between;margin-bottom:16px;font-size:20px;font-weight:600;">
                <span>Total</span>
                <span id="cartTotal">0 €</span>
            </div>
            <a href="{{ url_for('checkout') }}" class="btn btn-gold btn-full">Passer la commande →</a>
        </div>
    </div>
</div>

<script>
function renderCart() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const container = document.getElementById('cartItems');
    const empty = document.getElementById('cartEmpty');
    const content = document.getElementById('cartContent');

    if (cart.length === 0) {
        empty.style.display = 'block';
        content.style.display = 'none';
        return;
    }

    empty.style.display = 'none';
    content.style.display = 'block';
    container.innerHTML = '';
    let total = 0;

    cart.forEach((item, index) => {
        total += item.price * item.quantity;
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:16px;background:var(--white);padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);';
        row.innerHTML = `
            <img src="${item.image || ''}" alt="${item.name}" style="width:80px;height:80px;object-fit:cover;border-radius:var(--radius);background:var(--bg-2);">
            <div style="flex:1;">
                <div style="font-weight:600;">${item.name}</div>
                <div style="color:var(--gold-dark);">${item.price} €</div>
            </div>
            <input type="number" min="1" value="${item.quantity}" style="width:60px;padding:8px;border:1px solid var(--border);border-radius:var(--radius);" onchange="updateQty(${index}, this.value)">
            <button onclick="removeItem(${index})" style="background:none;border:none;color:#c0392b;cursor:pointer;font-size:18px;">✕</button>
        `;
        container.appendChild(row);
    });

    document.getElementById('cartTotal').textContent = total.toFixed(2) + ' €';
}

function updateQty(index, value) {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    cart[index].quantity = Math.max(1, parseInt(value, 10) || 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

function removeItem(index) {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

renderCart();
</script>

{% endblock %}
