{% extends "public/base.html" %}
{% block title %}Mot de passe oublié - {{ site_name }}{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Mot de passe oublié</h1>
    <p>Recevez un lien pour réinitialiser votre mot de passe</p>
</div>

<div class="account-form-wrapper">
    <form method="POST" class="account-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" class="form-control" required autofocus>
        </div>

        <button type="submit" class="btn btn-gold btn-full">Envoyer le lien de réinitialisation</button>

        <p style="text-align:center;margin-top:20px;color:var(--text-light);">
            <a href="{{ url_for('account_login') }}" style="color:var(--gold);">Retour à la connexion</a>
        </p>
    </form>
</div>

<style>
.account-form-wrapper {
    max-width: 480px;
    margin: 0 auto;
    background: var(--white);
    padding: 40px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}
</style>

{% endblock %}
