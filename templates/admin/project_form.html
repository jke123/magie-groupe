{% extends "admin/base.html" %}
{% block title %}{% if project %}Modifier{% else %}Nouveau{% endif %} Projet - Admin{% endblock %}
{% block content %}

<div class="content-header">
    <h1>
        <i class="fas fa-{% if project %}edit{% else %}plus{% endif %}" style="color:var(--gold);margin-right:12px;"></i>
        {% if project %}Modifier le Projet{% else %}Nouveau Projet{% endif %}
    </h1>
    <a href="{{ url_for('admin_projects') }}" class="btn btn-secondary btn-sm">
        <i class="fas fa-arrow-left"></i> Retour
    </a>
</div>

<div class="admin-form-container">
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="title"><i class="fas fa-tag" style="color:var(--gold);margin-right:6px;"></i> Titre du projet <span class="required">*</span></label>
            <input type="text" id="title" name="title" class="form-control" value="{{ project.title if project else '' }}" required>
        </div>

        <div class="form-group">
            <label for="description"><i class="fas fa-align-left" style="color:var(--gold);margin-right:6px;"></i> Description</label>
            <textarea id="description" name="description" class="form-control" rows="4">{{ project.description if project else '' }}</textarea>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label for="category"><i class="fas fa-folder" style="color:var(--gold);margin-right:6px;"></i> Catégorie</label>
                <select id="category" name="category" class="form-control">
                    <option value="video" {% if project and project.category == 'video' %}selected{% endif %}>Production Vidéo</option>
                    <option value="photo" {% if project and project.category == 'photo' %}selected{% endif %}>Photographie</option>
                    <option value="evenementiel" {% if project and project.category == 'evenementiel' %}selected{% endif %}>Événementiel</option>
                </select>
            </div>
            <div class="form-group">
                <label for="client"><i class="fas fa-user" style="color:var(--gold);margin-right:6px;"></i> Client</label>
                <input type="text" id="client" name="client" class="form-control" value="{{ project.client if project else '' }}">
            </div>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label for="date"><i class="fas fa-calendar" style="color:var(--gold);margin-right:6px;"></i> Date de réalisation</label>
                <input type="text" id="date" name="date" class="form-control" placeholder="ex: Janvier 2026" value="{{ project.date if project else '' }}">
            </div>
            <div class="form-group">
                <label for="video_url"><i class="fas fa-play-circle" style="color:var(--gold);margin-right:6px;"></i> URL vidéo (YouTube/Vimeo embed)</label>
                <input type="url" id="video_url" name="video_url" class="form-control" value="{{ project.video_url if project else '' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="image"><i class="fas fa-image" style="color:var(--gold);margin-right:6px;"></i> Image {% if project and project.image %}(laisser vide pour conserver l'actuelle){% endif %}</label>
            {% if project and project.image %}
            <img src="{{ project.image }}" alt="" style="width:100px;height:100px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block;">
            {% endif %}
            <input type="file" id="image" name="image" class="form-control" accept="image/*">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="featured" name="featured" {% if project and project.featured %}checked{% endif %}>
            <label for="featured" style="margin:0;"><i class="fas fa-star" style="color:var(--gold);margin-right:6px;"></i> Mettre en vedette sur la page d'accueil</label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> Enregistrer</button>
            <a href="{{ url_for('admin_projects') }}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
