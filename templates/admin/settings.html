{% extends "admin/base.html" %}

{% block title %}Paramètres - Admin{% endblock %}

{% block content %}
<div class="admin-content">
    <div class="content-header">
        <h1><i class="fas fa-cog" style="color:var(--gold);margin-right:12px;"></i> Paramètres du Site</h1>
    </div>

    <div class="settings-sections">
        <div class="settings-card">
            <h3><i class="fas fa-info-circle" style="color:var(--gold);margin-right:8px;"></i> Informations Générales</h3>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="form-group">
                    <label for="site_name"><i class="fas fa-tag" style="color:var(--gold);margin-right:6px;"></i> Nom du site</label>
                    <input type="text" id="site_name" name="site_name" class="form-control" value="{{ settings.get('site_name', 'Magie Groupe') }}">
                </div>
                
                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone" style="color:var(--gold);margin-right:6px;"></i> Téléphone</label>
                    <input type="text" id="phone" name="phone" class="form-control" value="{{ settings.get('phone', '') }}">
                </div>
                
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope" style="color:var(--gold);margin-right:6px;"></i> Email</label>
                    <input type="email" id="email" name="email" class="form-control" value="{{ settings.get('email', '') }}">
                </div>
                
                <div class="form-group">
                    <label for="address"><i class="fas fa-location-dot" style="color:var(--gold);margin-right:6px;"></i> Adresse</label>
                    <textarea id="address" name="address" class="form-control" rows="3">{{ settings.get('address', '') }}</textarea>
                </div>
                
                <div class="form-group">
                    <label for="whatsapp"><i class="fab fa-whatsapp" style="color:var(--gold);margin-right:6px;"></i> WhatsApp</label>
                    <input type="text" id="whatsapp" name="whatsapp" class="form-control" value="{{ settings.get('whatsapp', '') }}">
                </div>
                
                <h4 style="margin-top:2rem;"><i class="fas fa-share-alt" style="color:var(--gold);margin-right:8px;"></i> Réseaux Sociaux</h4>
                
                <div class="form-group">
                    <label for="instagram"><i class="fab fa-instagram" style="color:var(--gold);margin-right:6px;"></i> Instagram</label>
                    <input type="url" id="instagram" name="instagram" class="form-control" value="{{ settings.get('instagram', '') }}">
                </div>
                
                <div class="form-group">
                    <label for="facebook"><i class="fab fa-facebook-f" style="color:var(--gold);margin-right:6px;"></i> Facebook</label>
                    <input type="url" id="facebook" name="facebook" class="form-control" value="{{ settings.get('facebook', '') }}">
                </div>
                
                <div class="form-group">
                    <label for="tiktok"><i class="fab fa-tiktok" style="color:var(--gold);margin-right:6px;"></i> TikTok</label>
                    <input type="url" id="tiktok" name="tiktok" class="form-control" value="{{ settings.get('tiktok', '') }}">
                </div>
                
                <button type="submit" class="btn btn-gold">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
            </form>
        </div>

        <div class="settings-card">
            <h3><i class="fas fa-shield-alt" style="color:var(--gold);margin-right:8px;"></i> Sécurité</h3>
            <p>Gérez la sécurité de votre compte administrateur</p>
            <a href="{{ url_for('admin_change_password') }}" class="btn btn-secondary">
                <i class="fas fa-key"></i> Changer le Mot de Passe
            </a>
        </div>
    </div>
</div>

<style>
.settings-sections {
    display: grid;
    gap: 2rem;
}
.settings-card {
    background: var(--white);
    padding: 2rem;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
}
.settings-card h3 {
    margin-top: 0;
    color: var(--gold-dark);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 0.5rem;
    margin-bottom: 1.5rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
}
.settings-card h4 {
    color: var(--black);
    margin-bottom: 1rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
}
.settings-card p {
    color: var(--text-light);
    margin-bottom: 1rem;
}
</style>
{% endblock %}
