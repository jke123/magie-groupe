{% extends "admin/base.html" %}

{% block title %}Changer le Mot de Passe - Admin{% endblock %}

{% block content %}
<div class="admin-content">
    <div class="content-header">
        <h1><i class="fas fa-key" style="color:var(--gold);margin-right:12px;"></i> Changer le Mot de Passe</h1>
        <a href="{{ url_for('admin_settings') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Retour aux Paramètres
        </a>
    </div>

    <div class="form-container" style="max-width:600px;margin:2rem auto;background:var(--white);padding:2rem;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);">
        <form method="POST" class="admin-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="current_password"><i class="fas fa-lock" style="color:var(--gold);margin-right:6px;"></i> Mot de passe actuel *</label>
                <input type="password" id="current_password" name="current_password" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="new_password"><i class="fas fa-lock" style="color:var(--gold);margin-right:6px;"></i> Nouveau mot de passe *</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required minlength="6">
                <small style="display:block;margin-top:4px;color:var(--text-light);font-size:12px;">
                    <i class="fas fa-info-circle" style="color:var(--gold);"></i> Minimum 6 caractères
                </small>
            </div>

            <div class="form-group">
                <label for="confirm_password"><i class="fas fa-check-circle" style="color:var(--gold);margin-right:6px;"></i> Confirmer le nouveau mot de passe *</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-gold">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
                <a href="{{ url_for('admin_settings') }}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
